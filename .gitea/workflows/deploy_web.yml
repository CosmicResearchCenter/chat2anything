name: Deploy Web Application
on:
  push:
    branches:
      - release_web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create test environment file
        run: |
          cd docker
          cat > .env << 'EOF'
          VITE_APP_BASE_URL=/api
          WEB_PORT=80
          EOF

      - name: Create chat2network
        run: docker network create chat2network || true

      - name: Test frontend build
        run: |
          cd docker
          docker compose -f docker-compose-web.yml build
          
      - name: Test frontend startup
        run: |
          cd docker
          docker compose -f docker-compose-web.yml up -d
          
      - name: Wait for frontend to start
        run: |
          echo "Waiting for frontend..."
          timeout 60s bash -c 'until curl -f http://localhost:80; do sleep 5; done'

      - name: Check frontend logs
        run: |
          docker logs chat2anything_frontend
          docker logs chat2anything_nginx

      - name: Cleanup test environment
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-web.yml down || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "echo 'SSH connection successful'"

      - name: Copy entire project to remote server
        timeout-minutes: 15
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "rm -rf ~/chat2anything_new && mkdir -p ~/chat2anything_new"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -P ${{ secrets.SSH_PORT }} -r . ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:~/chat2anything_new/

      - name: Move project to final location
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "
            rm -rf ~/chat2anything_backup
            [ -d ~/chat2anything ] && mv ~/chat2anything ~/chat2anything_backup
            mv ~/chat2anything_new ~/chat2anything
          "

      - name: Deploy web application on remote server
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ~/chat2anything/docker
            chmod +x deploy-web.sh
            ./deploy-web.sh
          EOF