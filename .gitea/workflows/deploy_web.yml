name: Deploy Web Application
on:
  push:
    branches:
      - release_web

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "echo 'SSH connection successful'"

      - name: Prepare remote directories
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "
            rm -rf /opt/chat2anything/docker_new /opt/chat2anything/web_new
            mkdir -p /opt/chat2anything/docker_new /opt/chat2anything/web_new
          "

      - name: Copy docker files
        timeout-minutes: 5
        run: |
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -P ${{ secrets.SSH_PORT }} -r docker/* ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/chat2anything/docker_new/

      - name: Copy web files
        timeout-minutes: 10
        run: |
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -P ${{ secrets.SSH_PORT }} -r web ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/chat2anything/web_new/

      - name: Move files to final location
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "
            mkdir -p /opt/chat2anything/docker /opt/chat2anything
            cp -r /opt/chat2anything/docker_new/* /opt/chat2anything/docker/
            cp -r /opt/chat2anything/web_new/web /opt/chat2anything/
            rm -rf /opt/chat2anything/docker_new /opt/chat2anything/web_new
          "

      - name: Deploy web application on remote server
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd /opt/chat2anything/docker
            chmod +x deploy-web.sh
            ./deploy-web.sh
          EOF