name: Deploy Web Application
on:
  push:
    branches:
      - release_web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: 设置环境变量
        run: |
          cd docker
          cp .env_copy .env

      - name: 运行前端项目-测试
        run: |
          pwd
          cd docker
          pwd
          ls -all
          docker compose -f docker-compose-web.yml up -d --build
            
      - name: 检查前端服务是否启动
        run: |
          echo "Waiting for frontend..."
          timeout 60s bash -c 'until curl -f http://localhost:9966; do sleep 5; done'

      - name: 检查日志
        run: |
          docker logs chat2anything_frontend
          docker logs chat2anything_nginx

      - name: 清理测试环境
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-web.yml down || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH连接
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH连接测试
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "echo 'SSH connection successful'"

      - name: 复制整个项目到远程服务器
        timeout-minutes: 15
        run: |
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -P ${{ secrets.SSH_PORT }} -r . ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:~/chat2anything/

      - name: 部署前端应用到远程服务器
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ~/chat2anything/docker
            chmod +x deploy-web.sh
            ./deploy-web.sh
          EOF