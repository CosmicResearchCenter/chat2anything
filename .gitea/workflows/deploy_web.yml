name: Deploy Web Application
on:
  push:
    branches:
      - release_web

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "echo 'SSH connection successful'"

      - name: Copy entire project to remote server
        timeout-minutes: 15
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "rm -rf ~/chat2anything_new && mkdir -p ~/chat2anything_new"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -P ${{ secrets.SSH_PORT }} -r . ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:~/chat2anything_new/

      - name: Move project to final location
        timeout-minutes: 2
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "
            rm -rf ~/chat2anything_backup
            [ -d ~/chat2anything ] && mv ~/chat2anything ~/chat2anything_backup
            mv ~/chat2anything_new ~/chat2anything
          "

      - name: Deploy web application on remote server
        timeout-minutes: 10
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ~/chat2anything/docker
            chmod +x deploy-web.sh
            ./deploy-web.sh
          EOF