name: Deploy Backend Application
on:
  push:
    branches:
      - release_app

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files to remote server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} "mkdir -p /opt/chat2anything/docker"
          scp -P ${{ secrets.SSH_PORT }} -r docker/* ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/chat2anything/docker/
          scp -P ${{ secrets.SSH_PORT }} -r backend ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/chat2anything/

      - name: Deploy backend application on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd /opt/chat2anything/docker
            chmod +x deploy-app.sh
            ./deploy-app.sh
          EOF