# 开发环境配置
# 支持热重载、调试、本地开发
# 使用命令: docker-compose -f docker-compose.dev.yml up

version: '3.8'

networks:
  chat2network:
    driver: bridge
    name: chat2network

services:
  # MySQL 开发数据库
  mysql:
    image: mysql:8.0
    container_name: chat2anything_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_BASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    env_file:
      - .env.dev
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - chat2network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # Elasticsearch 开发实例 (轻量级)
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: chat2anything_es_dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - TAKE_FILE_OWNERSHIP=true
      - TZ=Asia/Shanghai
    ports:
      - "${ES_BASE_PORT}:9200"
    env_file:
      - .env.dev
    volumes:
      - es_dev_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    user: "1000:1000"
    networks:
      - chat2network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Milvus 开发实例 (可选，如果不需要可以注释掉)
  milvus:
    container_name: chat2anything_milvus_dev
    image: milvusdb/milvus:v2.4.13-hotfix
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - TZ=Asia/Shanghai
    env_file:
      - .env.dev
    volumes:
      - milvus_dev_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT}:19530"
      - "9091:9091"
    networks:
      - chat2network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # 后端服务 (开发模式 - 支持热重载)
  chat2anything_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
      args:
        - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: chat2anything_backend_dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_KEY: ${ADMIN_KEY}
      MYSQL_IP: ${MYSQL_IP}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BASE: ${MYSQL_BASE}
      ES_HOST: ${ES_BASE_URL}
      ES_PORT: ${ES_BASE_PORT}
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      SPPLITTER_MODEL: ${SPPLITTER_MODEL}
      PYTHONUNBUFFERED: 1
      TZ: Asia/Shanghai
    env_file:
      - .env.dev
    networks:
      - chat2network
    ports:
      - "9988:9988"
      - "5678:5678"  # 调试端口
    volumes:
      - ../backend:/app
      - /app/__pycache__
    command: sh -c "pip install debugpy && python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn main:app --host 0.0.0.0 --port 9988 --reload"
    # 如果不需要调试，使用下面的命令
    # command: sh -c "uvicorn main:app --host 0.0.0.0 --port 9988 --reload"

  # 前端开发服务
  chat2anything_front:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
      args:
        - VITE_APP_BASE_URL=/api
        - NPM_REGISTRY=https://registry.npmmirror.com
    container_name: chat2anything_frontend_dev
    restart: unless-stopped
    depends_on:
      - chat2anything_backend
    networks:
      - chat2network
    environment:
      - VITE_APP_BASE_URL=/api
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    env_file:
      - .env.dev
    ports:
      - "3000:3000"  # Vite 开发服务器端口
    volumes:
      - ../web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

  # Nginx 开发代理 (可选，可以直接访问前端)
  nginx:
    image: nginx:alpine
    container_name: chat2anything_nginx_dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat2anything_backend
      - chat2anything_front
    networks:
      - chat2network
    environment:
      - TZ=Asia/Shanghai

# 数据卷定义
volumes:
  mysql_dev_data:
    driver: local
  es_dev_data:
    driver: local
  milvus_dev_data:
    driver: local
