version: '3.8'

networks:
  chat2network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: chat2anything_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_BASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - chat2network

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: chat2anything_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # 添加以下环境变量
      - "TAKE_FILE_OWNERSHIP=true"
    ports:
      - "${ES_BASE_PORT}:9200"
      - 9300:9300
    env_file:
      - .env
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    user: "1000:1000"  # 使用特定UID:GID运行容器
    networks:
      - chat2network

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chat2network
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./milvus/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
          - chat2network
  standalone:
    container_name: chat2anything_milvus
    image: milvusdb/milvus:v2.4.13-hotfix
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    env_file:
      - .env
    volumes:
      - ./milvus/milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT}:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - chat2network

  chat2anything_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: chat2anything_backend
    depends_on:
      - mysql
      - elasticsearch
      - standalone
      - minio
      - etcd
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_KEY: ${ADMIN_KEY}
      MYSQL_IP: ${MYSQL_IP}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BASE: ${MYSQL_BASE}
      ES_HOST: elasticsearch
      ES_PORT: ${ES_BASE_PORT}
      MILVUS_HOST: standalone
      MILVUS_PORT: 19530
      SPPLITTER_MODEL : ${SPPLITTER_MODEL}
    env_file:
      - .env
    networks:
      - chat2network
    ports:
      - "9988:9988"
  chat2anything_front:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
      - VITE_APP_BASE_URL=/api
    container_name: chat2anything_frontend
    depends_on:
      - chat2anything_backend
    networks:
      - chat2network
    ports:
      - "12345:80"
    environment:
      - VITE_APP_BASE_URL=/api
    env_file:
      - .env
  nginx:
    image: nginx:alpine
    container_name: chat2anything_nginx
    ports:
      - "${WEB_PORT}:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - chat2anything_backend
      - chat2anything_front
    networks:
      - chat2network