# 生产环境完整部署配置
# 使用命令: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

networks:
  chat2network:
    driver: bridge
    name: chat2network

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: chat2anything_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_BASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    env_file:
      - .env
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chat2network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: chat2anything_es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - TAKE_FILE_OWNERSHIP=true
      - TZ=Asia/Shanghai
    ports:
      - "${ES_BASE_PORT}:9200"
      - "9300:9300"
    env_file:
      - .env
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    user: "1000:1000"
    networks:
      - chat2network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Etcd (Milvus 依赖)
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chat2network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Minio (Milvus 依赖)
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chat2network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Milvus 向量数据库
  standalone:
    container_name: chat2anything_milvus
    image: milvusdb/milvus:v2.4.13-hotfix
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    env_file:
      - .env
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT}:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - chat2network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # 后端服务
  chat2anything_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: chat2anything_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      standalone:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_KEY: ${ADMIN_KEY}
      MYSQL_IP: ${MYSQL_IP}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BASE: ${MYSQL_BASE}
      ES_HOST: ${ES_BASE_URL}
      ES_PORT: ${ES_BASE_PORT}
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      SPPLITTER_MODEL: ${SPPLITTER_MODEL}
      TZ: Asia/Shanghai
    env_file:
      - .env
    networks:
      - chat2network
    ports:
      - "9988:9988"
    volumes:
      - ../backend:/app
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # 前端构建服务
  chat2anything_front:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        - VITE_APP_BASE_URL=/api
        - NPM_REGISTRY=https://registry.npmmirror.com
    container_name: chat2anything_frontend
    restart: unless-stopped
    depends_on:
      - chat2anything_backend
    networks:
      - chat2network
    environment:
      - VITE_APP_BASE_URL=/api
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: chat2anything_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - chat2anything_backend
      - chat2anything_front
    networks:
      - chat2network
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# 数据卷定义
volumes:
  mysql_data:
    driver: local
  es_data:
    driver: local
  milvus_etcd:
    driver: local
  milvus_minio:
    driver: local
  milvus_data:
    driver: local
