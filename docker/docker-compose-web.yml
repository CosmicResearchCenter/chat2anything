version: '3.8'

networks:
  chat2network:
    external: true

services:
  chat2anything_front:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        - VITE_APP_BASE_URL=/api
    container_name: chat2anything_frontend
    networks:
      - chat2network
    environment:
      - VITE_APP_BASE_URL=/api
    env_file:
      - .env


  nginx:
    image: nginx:alpine
    container_name: chat2anything_nginx
    ports:
      - "${WEB_PORT:-80}:80"
    env_file:
      - .env
    volumes:
      # 挂载到临时位置
      - ./nginx.conf:/tmp/nginx.conf:ro
      # 创建日志目录
      - ./logs:/var/log/nginx
    depends_on:
      - chat2anything_front
    networks:
      - chat2network
    # 使用命令替换配置文件并启动
    command: >
      sh -c "
        cp /tmp/nginx.conf /etc/nginx/nginx.conf &&
        nginx -t &&
        nginx -g 'daemon off;'
      "
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${WEB_PORT:-80}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s